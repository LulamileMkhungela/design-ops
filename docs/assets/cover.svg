<svg xmlns="http://www.w3.org/2000/svg" width="1568" height="652" viewBox="0 0 1568 652" role="img" aria-labelledby="title desc">
  <title id="title">DesignOps lint: a real diagnostic for a restyled Button</title>
  <desc id="desc">An editor shows &lt;Button className="p-4" /&gt;. The designops/no-restyle rule reports that Button owns its spacing and points to a size variant instead.</desc>

  <defs>
    <radialGradient id="bg" cx="18%" cy="0%" r="90%">
      <stop offset="0" stop-color="#1b1b18"/>
      <stop offset="0.55" stop-color="#0d0d0b"/>
      <stop offset="1" stop-color="#080807"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: "DejaVu Sans Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .ui { font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
      .code { font-size: 22px; fill: #f0ede6; }
      .num { font-size: 22px; fill: #5f5f57; }
      .dim { fill: #8b8b81; }
      .lime { fill: #e8ff5a; }
      .pink { fill: #f38ba8; }
      .blue { fill: #89b4fa; }
      .mauve { fill: #cba6f7; }
      .peach { fill: #fab387; }
    </style>
  </defs>

  <rect width="1568" height="652" fill="url(#bg)"/>
  <rect width="1568" height="652" fill="url(#grid)"/>

  <!-- brand -->
  <g transform="translate(64 48)">
    <rect width="12" height="12" rx="2" fill="#e8ff5a"/>
    <rect x="16" width="12" height="12" rx="2" fill="#e8ff5a" opacity="0.7"/>
    <rect y="16" width="12" height="12" rx="2" fill="#e8ff5a" opacity="0.7"/>
    <rect x="16" y="16" width="12" height="12" rx="2" fill="#e8ff5a" opacity="0.35"/>
    <text x="44" y="15" class="ui" font-size="27" font-weight="700" fill="#f0ede6">DesignOps</text>
    <text x="213" y="15" class="mono" font-size="15" fill="#8b8b81">· @designops/lint</text>
  </g>
  <text x="1504" y="64" text-anchor="end" class="mono" font-size="14" letter-spacing="2" fill="#8b8b81">DESIGN ONCE · SHIP EVERYWHERE</text>

  <!-- editor -->
  <rect x="64" y="96" width="1440" height="472" rx="18" fill="#141412" stroke="#2a2a26"/>
  <path d="M64 140h1440" stroke="#2a2a26"/>
  <circle cx="94" cy="118" r="6" fill="#3a3a33"/>
  <circle cx="116" cy="118" r="6" fill="#3a3a33"/>
  <circle cx="138" cy="118" r="6" fill="#3a3a33"/>
  <text x="180" y="125" class="mono" font-size="16" fill="#f0ede6">App.tsx</text>
  <rect x="258" y="108" width="52" height="24" rx="12" fill="#1e1e1b" stroke="#2a2a26"/>
  <text x="284" y="125" text-anchor="middle" class="mono" font-size="12" fill="#8b8b81">src</text>

  <!-- code -->
  <g class="mono">
    <text x="150" y="204" text-anchor="end" class="num">1</text>
    <text x="184" y="204" class="code"><tspan class="mauve">import</tspan> { Button } <tspan class="mauve">from</tspan> <tspan class="peach">"@/components/ui/button"</tspan></text>

    <text x="150" y="248" text-anchor="end" class="num">2</text>

    <text x="150" y="292" text-anchor="end" class="num">3</text>
    <text x="184" y="292" class="code"><tspan class="mauve">export default function</tspan> <tspan class="blue">App</tspan>() {</text>

    <text x="150" y="336" text-anchor="end" class="num">4</text>
    <text x="184" y="336" class="code">  <tspan class="mauve">return</tspan> &lt;Button <tspan class="peach">className</tspan>=<tspan class="peach">"p-4"</tspan> /&gt;</text>

    <text x="150" y="380" text-anchor="end" class="num">5</text>
    <text x="184" y="380" class="code">}</text>
  </g>

  <!-- the squiggle sits under p-4 -->
  <path d="M508 344 q7 8 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#dd4040" stroke-width="3" stroke-linecap="round"/>

  <!-- diagnostic -->
  <g filter="url(#shadow)">
    <rect x="440" y="402" width="1010" height="224" rx="14" fill="#1e1e1b" stroke="#3a3a33"/>
  </g>
  <path d="M440 416a14 14 0 0 1 14-14h982a14 14 0 0 1 14 14v4h-4a10 10 0 0 0-10-10H454a10 10 0 0 0-10 10h-4z" fill="#e8ff5a"/>
  <text x="472" y="450" class="mono" font-size="18" fill="#f0ede6">"p-4" is not allowed on &lt;Button&gt;: &lt;Button&gt; owns its spacing.</text>
  <text x="472" y="480" class="mono" font-size="18" fill="#f0ede6">Use a size (default, xs, sm, lg, icon, icon-xs, icon-sm,</text>
  <text x="472" y="510" class="mono" font-size="18" fill="#f0ede6">icon-lg), or margin here or gap on the parent for space around it.</text>
  <text x="472" y="540" class="mono" font-size="18" fill="#f0ede6">Add a size in components/ui/button.tsx only if the design</text>
  <text x="472" y="570" class="mono" font-size="18" fill="#f0ede6">explicitly calls for one.</text>

  <rect x="1310" y="418" width="112" height="26" rx="13" fill="none" stroke="#e8ff5a" stroke-opacity="0.55"/>
  <text x="1366" y="436" text-anchor="middle" class="mono" font-size="12" fill="#e8ff5a">no-restyle</text>

  <text x="472" y="604" class="mono" font-size="14" fill="#8b8b81">designops/no-restyle</text>
  <text x="1418" y="604" text-anchor="end" class="mono" font-size="14" fill="#8b8b81">App.tsx(4, 28)</text>
</svg>
